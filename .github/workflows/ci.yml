name: CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke
        shell: bash
        run: |
          energologic validate examples/minimal.energologic.json
          energologic canonicalize examples/minimal.energologic.json > canonical.json
          energologic fingerprint examples/minimal.energologic.json > fingerprint.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib

          canonical = Path("canonical.json").read_bytes()
          actual = Path("fingerprint.txt").read_text(encoding="ascii").strip()
          expected = hashlib.sha256(canonical).hexdigest()
          if actual != expected:
              raise SystemExit(f"fingerprint mismatch: {actual} != {expected}")
          PY


  solver:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install solver extra
        run: python -m pip install -e ".[solver-pandapower]"

      - name: Compile
        run: python -m compileall -q src

      - name: Full suite with pandapower
        run: python -m unittest discover -s tests -v

      - name: Solver dependency footprint
        run: python tools/solver_dependency_probe.py
